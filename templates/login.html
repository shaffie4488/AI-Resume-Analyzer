<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ResumeIQ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                ResumeIQ
            </div>


            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue analyzing your resume
            </p>


            <!-- Login Error -->

            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <!-- Login Form -->

            <form method="POST" action="/login">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login

                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <a href="/" class="back-home">

                ← Back to Home

            </a>

        </div>

    </div>

</body>

</html>
